name: LockIn
options:
  bundleIdPrefix: com.sunnyjackson.lockin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  LockInKit:
    type: framework
    platform: iOS
    sources:
      - path: LockInKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnyjackson.lockin.kit
        PRODUCT_NAME: LockInKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        CURRENT_PROJECT_VERSION: "1"
  LockIn:
    type: application
    platform: iOS
    sources:
      - path: LockIn
    dependencies:
      - target: LockInKit
        embed: true
      - target: LockInWidgets
        embed: true
      - target: LockInFocusMonitor
        embed: true
      - target: LockInShield
        embed: true
    info:
      path: Config/LockIn-Info.plist
      properties:
        CFBundleDisplayName: Lock In
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        NSCameraUsageDescription: Lock In uses the camera for meal and progress photos.
        NSPhotoLibraryUsageDescription: Lock In reads photos you pick for meals, boards and progress.
        NSPhotoLibraryAddUsageDescription: Lock In saves photos you take to your library.
        NSFaceIDUsageDescription: Lock In can use Face ID to open the app.
    entitlements:
      path: Config/LockIn.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sunnyjackson.lockin
        com.apple.developer.family-controls: true
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnyjackson.lockin
        INFOPLIST_FILE: Config/LockIn-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/LockIn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  LockInWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LockInWidgets
    dependencies:
      - target: LockInKit
        embed: false
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: Config/LockInWidgets-Info.plist
      properties:
        CFBundleDisplayName: Lock In
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/LockInWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sunnyjackson.lockin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnyjackson.lockin.widgets
        INFOPLIST_FILE: Config/LockInWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/LockInWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  LockInFocusMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: LockInFocusMonitor
    dependencies:
      - target: LockInKit
        embed: false
    info:
      path: Config/LockInFocusMonitor-Info.plist
      properties:
        CFBundleDisplayName: Lock In Focus Monitor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FocusMonitor"
    entitlements:
      path: Config/LockInFocusMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sunnyjackson.lockin
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnyjackson.lockin.focusmonitor
        INFOPLIST_FILE: Config/LockInFocusMonitor-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/LockInFocusMonitor.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  LockInShield:
    type: app-extension
    platform: iOS
    sources:
      - path: LockInShield
    dependencies:
      - target: LockInKit
        embed: false
    info:
      path: Config/LockInShield-Info.plist
      properties:
        CFBundleDisplayName: Lock In Shield
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedConfiguration.shield-configuration-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShieldConfig"
    entitlements:
      path: Config/LockInShield.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sunnyjackson.lockin
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnyjackson.lockin.shield
        INFOPLIST_FILE: Config/LockInShield-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/LockInShield.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  LockInKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LockInKitTests
    dependencies:
      - target: LockInKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnyjackson.lockin.kittests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  LockIn:
    build:
      targets:
        LockIn: all
    run:
      config: Debug
    archive:
      config: Release
  LockInKitTests:
    build:
      targets:
        LockInKit: all
        LockInKitTests: all
    test:
      config: Debug
      targets:
        - LockInKitTests
